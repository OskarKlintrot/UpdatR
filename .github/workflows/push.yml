name: push packages

on:
  push:
    tags:
      - v**

jobs:
  push-packages:

    runs-on: ubuntu-latest
    environment: Push package

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x.x
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push NuGet Packages
      run: dotnet run Build.cs -- push --parallel
      working-directory: tools/Build
      env:
          API_ACCESS_TOKEN: ${{ steps.login.outputs.NUGET_API_KEY }}
