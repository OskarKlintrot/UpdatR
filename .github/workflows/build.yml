name: build

on:
  workflow_dispatch:
  push:
    branches: 
    - main
    - update
  pull_request:
    branches:
    - main

jobs:
  run-tests:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      pull-requests: read

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.x.x
          8.x.x
          10.x.x
    - name: Run tests
      run: dotnet run Build.cs -- test --parallel
      working-directory: tools/Build
    - name: Verify generated docs are up to date
      if: matrix.os == 'ubuntu-latest'
      run: |
        if ! git diff --exit-code -- README.md mdsource/cli-usage.txt; then
          echo "::error::README.md and/or mdsource/cli-usage.txt are out of date. Run 'dotnet run Build.cs -- generate-docs' from tools/Build and commit the result."
          exit 1
        fi
    - name: Upload code coverage (artifact)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-${{ matrix.os }}
        path: Artifacts/coverage/**/*.cobertura.xml
        if-no-files-found: warn
